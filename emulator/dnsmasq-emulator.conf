# Second dnsmasq instance dedicated to the Android emulator.
# Answers *.test with 10.0.2.2 (the emulator's alias for the host machine)
# instead of Herd's 127.0.0.1, so hostnames resolve to something the guest
# can actually reach. Everything else is refused (no recursion, no upstream).
listen-address=127.0.0.2
bind-interfaces
port=53
no-resolv
no-hosts
address=/test/10.0.2.2
